<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AngoDate ❤ Conheça Angola</title>
<style>body{font-family:system-ui;margin:0;background:#fff5f5;color:#222}header{background:#c8102e;color:#ffd700;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0002}button{background:#c8102e;color:#fff;border:0;border-radius:8px;padding:8px 14px;margin:2px;cursor:pointer}input,select,textarea{width:100%;padding:8px;margin:4px 0;box-sizing:border-box}nav button{background:#111;color:#ffd700}.v{color:#1da1f2}.b{background:#ffd700;color:#000;border-radius:6px;padding:1px 6px;font-size:12px}</style></head><body>
<header><b>🇦🇴 AngoDate</b><span id="st"></span></header><main id="app"></main>
<script>
let T=localStorage.t,U=null;const $=s=>document.querySelector(s),app=$('#app');
const fmt=n=>n.toLocaleString('pt-AO')+' Kz';
async function api(m,p,b){const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok){alert(j.error);throw j.error}return j}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function auth(){app.innerHTML=`<div class=card><h2>Entrar</h2><input id=e placeholder=Email><input id=p type=password placeholder=Senha><button onclick=login()>Entrar</button></div>
<div class=card><h2>Criar conta (18+)</h2><input id=rn placeholder=Nome><input id=re placeholder=Email><input id=rp type=password placeholder="Senha (6+)"><input id=ra type=number placeholder=Idade><input id=rc placeholder="País de origem"><input id=ri placeholder="Cidade em Angola" value=Luanda><textarea id=rb placeholder=Sobre></textarea><button onclick=reg()>Registar</button></div>`}
async function login(){const r=await api('POST','login',{email:$('#e').value,password:$('#p').value});T=localStorage.t=r.token;start()}
async function reg(){const r=await api('POST','register',{name:$('#rn').value,email:$('#re').value,password:$('#rp').value,age:+$('#ra').value,country:$('#rc').value,city:$('#ri').value,bio:$('#rb').value});T=localStorage.t=r.token;start()}
function nav(){return`<nav><button onclick=disc()>Descobrir</button><button onclick=matches()>Matches</button><button onclick=likes()>Quem gostou</button><button onclick=plans()>Planos</button><button onclick=out()>Sair</button></nav>`}
function out(){localStorage.removeItem('t');T=null;$('#st').textContent='';auth()}
async function start(){if(!T)return auth();try{U=await api('GET','me')}catch{return auth()}$('#st').textContent=U.name+' · '+U.planName;disc()}
async function disc(){const l=await api('GET','discover');app.innerHTML=nav()+(l.map(u=>`<div class=card><h3>${esc(u.name)}, ${u.age} ${u.verified?'<span class=v>✔</span>':''}${u.boosted?'<span class=b>⚡</span>':''}</h3><div>${esc(u.country)} → ${esc(u.city)}</div><p>${esc(u.bio)}</p><button onclick="like('${u.id}')">❤ Gosto</button></div>`).join('')||'<div class=card>Sem perfis novos.</div>')}
async function like(i){const r=await api('POST','like/'+i,{});alert(r.match?'🎉 Match!':'Enviado');U=await api('GET','me');disc()}
async function matches(){const l=await api('GET','matches');app.innerHTML=nav()+l.map(u=>`<div class=card><b>${esc(u.name)}</b> <button onclick="chat('${u.id}')">Conversar</button></div>`).join('')}
async function chat(i){const m=await api('GET','messages/'+i);app.innerHTML=nav()+`<div class=card>${m.map(x=>`<p><b>${x.from==U.id?'Eu':'Ele/a'}:</b> ${esc(x.text)}</p>`).join('')}<input id=t><button onclick="send('${i}')">Enviar</button></div>`}
async function send(i){await api('POST','messages/'+i,{text:$('#t').value});chat(i)}
async function likes(){const r=await api('GET','likes-received');app.innerHTML=nav()+(r.locked?`<div class=card>🔒 ${r.count} pessoas gostaram de si. Assine Premium para ver.</div>`:r.users.map(u=>`<div class=card>${esc(u.name)} <button onclick="like('${u.id}')">❤</button></div>`).join(''))}
async function plans(){const r=await api('GET','plans');app.innerHTML=nav()+`<div class=card>Plano: <b>${U.planName}</b> ${U.planUntil?'até '+U.planUntil.slice(0,10):''} · Impulsos: ${U.boostsLeft}<br><button onclick=boost()>⚡ Usar impulso</button></div>`+r.plans.filter(p=>p.price).map(p=>`<div class=card><h3>${p.name} — ${fmt(p.price)}/mês</h3><ul><li>${p.likesPerDay??'Ilimitados'} likes/dia</li><li>Ver quem gostou</li>${p.msgBeforeMatch?'<li>Mensagens sem match</li>':''}<li>${p.boosts} impulso(s)</li>${p.verified?'<li>Selo verificado ✔</li>':''}</ul><select id=m-${p.id}>${r.methods.map(m=>`<option>${m}</option>`)}</select><button onclick="pay('${p.id}')">Pagar</button></div>`).join('')+`<div class=card><h3>Impulso 24h — ${fmt(3000)}</h3><select id=m-boost>${r.methods.map(m=>`<option>${m}</option>`)}</select><button onclick="pay('boost')">Comprar</button></div>`}
async function pay(i){const r=await api('POST','pay',{item:i,method:$('#m-'+i).value});U=r.user;alert('Pago: '+r.payment.desc+(r.payment.reference?' Ref '+r.payment.reference:''));start()}
async function boost(){U=await api('POST','boost');alert('Perfil impulsionado!');plans()}
start();
</script></body></html>
